[colors]
background = #00000000
foreground = #ffffff
accent = #89b4fa
alert = #f38ba8

[bar/main]
width = 100%
height = 30
radius = 12
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = JetBrainsMono Nerd Font:size=10;2

modules-left = launcher xworkspaces
modules-center = date
modules-right = updates wifi bluetooth pulseaudio power

cursor-click = pointer
wm-restack = i3

; Transparansi & efek halus
override-redirect = true

;;;;;;;;;;;;;;;;;;;;;;;;
;;   MODULES SECTION  ;;
;;;;;;;;;;;;;;;;;;;;;;;;

[module/launcher]
type = custom/text
content = "󰣇"
content-padding = 2
click-left = rofi -show drun &
format-foreground = ${colors.accent}

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = #000000
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = 
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a, %d %b %Y %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/checkupdates.sh
interval = 600
label = "󰚰 %output%"
click-left = alacritty -e yay -Syu
label-foreground = ${colors.accent}

[module/wifi]
type = internal/network
interface = wlan0
interval = 3.0
format-connected = "󰤨 %essid%"
format-disconnected = "󰤭  Offline"
label-connected-foreground = ${colors.foreground}
label-disconnected-foreground = ${colors.alert}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
label = %output%
click-left = blueman-manager

[module/pulseaudio]
type = internal/pulseaudio
format-volume = "  %percentage%%"
label-muted = " Muted"
click-left = pavucontrol

[module/power]
type = custom/text
content = ""
content-padding = 2
click-left = xfce4-session-logout &
format-foreground = ${colors.alert}
